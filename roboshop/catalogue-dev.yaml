apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogue-dev
  namespace: argocd-1
spec:
  project: default
  source:
    repoURL: 'https://github.com/daws-88s/catalogue-unit-tests.git'
    targetRevision: main # Replace with your desired version
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: 'https://default.svc'
    namespace: roboshop-dev
  syncPolicy:
    automated:
      prune: true