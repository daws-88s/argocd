apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace
  namespace: argocd-1
spec:
  project: default
  source:
    repoURL: https://github.com/daws-88s/argocd.git
    targetRevision: main
    path: namespaces
  destination:
    server: https://kubernetes.default.svc # current EKS cluster
    namespace: argocd-1
  syncPolicy:
    automated:
      prune: true # if deleted in git, delete in cluster also
      selfHeal: true # if someone manually change through CLI, do the self heal